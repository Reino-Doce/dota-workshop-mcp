name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test test/stdio-client.test.mjs
      - run: npm run test:plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s .agents/skills/dota-workshop-tools/tests -v
      - run: npm run build:api:2439
      - run: git diff --exit-code -- src/data/versions/2439
      - run: npm audit --audit-level=high
